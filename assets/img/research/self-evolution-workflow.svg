<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Self evolution workflow for code policies</title>
  <desc id="desc">A six stage loop from task specification through policy proposal, execution, observation, diagnosis, and frontier selection, followed by revision.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#627079"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #aab3b8; stroke-width: 1.5; }
      .accent { fill: #eaf5ee; stroke: #2e8b57; stroke-width: 2; }
      .step { font: 700 14px Arial, sans-serif; fill: #2e8b57; letter-spacing: 1.2px; }
      .label { font: 700 18px Arial, sans-serif; fill: #22303c; }
      .detail { font: 14px Arial, sans-serif; fill: #65717d; }
      .arrow { fill: none; stroke: #627079; stroke-width: 2; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #2e8b57; stroke-width: 2.5; marker-end: url(#arrow); }
      .looptext { font: 700 14px Arial, sans-serif; fill: #2e8b57; }
    </style>
  </defs>

  <rect width="1200" height="330" fill="#ffffff"/>

  <g transform="translate(25 70)">
    <rect class="box" width="165" height="125" rx="10"/>
    <text class="step" x="18" y="28">01</text>
    <text class="label" x="18" y="57">Specify</text>
    <text class="detail" x="18" y="84">task, horizon,</text>
    <text class="detail" x="18" y="105">metric, contract</text>
  </g>

  <path class="arrow" d="M 198 132 L 220 132"/>

  <g transform="translate(228 70)">
    <rect class="accent" width="165" height="125" rx="10"/>
    <text class="step" x="18" y="28">02</text>
    <text class="label" x="18" y="57">Propose</text>
    <text class="detail" x="18" y="84">hypothesis and</text>
    <text class="detail" x="18" y="105">executable policy</text>
  </g>

  <path class="arrow" d="M 401 132 L 423 132"/>

  <g transform="translate(431 70)">
    <rect class="box" width="165" height="125" rx="10"/>
    <text class="step" x="18" y="28">03</text>
    <text class="label" x="18" y="57">Execute</text>
    <text class="detail" x="18" y="84">run policy in</text>
    <text class="detail" x="18" y="105">the simulator</text>
  </g>

  <path class="arrow" d="M 604 132 L 626 132"/>

  <g transform="translate(634 70)">
    <rect class="box" width="165" height="125" rx="10"/>
    <text class="step" x="18" y="28">04</text>
    <text class="label" x="18" y="57">Observe</text>
    <text class="detail" x="18" y="84">score, trace,</text>
    <text class="detail" x="18" y="105">failure, video</text>
  </g>

  <path class="arrow" d="M 807 132 L 829 132"/>

  <g transform="translate(837 70)">
    <rect class="box" width="165" height="125" rx="10"/>
    <text class="step" x="18" y="28">05</text>
    <text class="label" x="18" y="57">Diagnose</text>
    <text class="detail" x="18" y="84">locate the current</text>
    <text class="detail" x="18" y="105">bottleneck</text>
  </g>

  <path class="arrow" d="M 1010 132 L 1032 132"/>

  <g transform="translate(1040 70)">
    <rect class="accent" width="135" height="125" rx="10"/>
    <text class="step" x="18" y="28">06</text>
    <text class="label" x="18" y="57">Select</text>
    <text class="detail" x="18" y="84">promote the</text>
    <text class="detail" x="18" y="105">frontier</text>
  </g>

  <path class="loop" d="M 1108 205 C 1108 280, 310 292, 310 205"/>
  <text class="looptext" x="650" y="277" text-anchor="middle">revise policy code with accumulated evidence</text>
</svg>
