<svg xmlns="http://www.w3.org/2000/svg" width="1008" height="180" viewBox="0 0 1008 180" role="img" aria-labelledby="title desc">
  <title id="title">The self-improvement loop</title>
  <desc id="desc">The language model writes a team policy, the policy is evaluated, and the feedback returns to the model for the next round.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/>
    </marker>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97757"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #aab3b8; stroke-width: 1.5; }
      .agent { fill: #fdf1ec; stroke: #d97757; stroke-width: 2; }
      .label { font: 700 20px Arial, sans-serif; fill: #1f1f1f; text-anchor: middle; dominant-baseline: middle; }
      .arrow { fill: none; stroke: #52514e; stroke-width: 2; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #d97757; stroke-width: 2.5; marker-end: url(#loop-arrow); }
      .looptext { font: 15px Arial, sans-serif; fill: #8a4a33; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1008" height="180" fill="#ffffff"/>
  <rect class="agent" x="24" y="28" width="280" height="80" rx="10"/>
  <text class="label" x="164" y="68">Write policy</text>
  <path class="arrow" d="M 316 68 H 352"/>
  <rect class="box" x="364" y="28" width="280" height="80" rx="10"/>
  <text class="label" x="504" y="68">Evaluate</text>
  <path class="arrow" d="M 656 68 H 692"/>
  <rect class="box" x="704" y="28" width="280" height="80" rx="10"/>
  <text class="label" x="844" y="68">Read feedback</text>
  <path class="loop" d="M 844 116 V 138 Q 844 150 832 150 H 176 Q 164 150 164 138 V 114"/>
  <text class="looptext" x="504" y="170">next round</text>
</svg>
