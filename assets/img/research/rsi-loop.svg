<svg xmlns="http://www.w3.org/2000/svg" width="1008" height="250" viewBox="0 0 1008 250" role="img" aria-labelledby="title desc">
  <title id="title">The self-improvement loop</title>
  <desc id="desc">The language model writes a proposal and a team policy, the harness runs one official evaluation, and the feedback returns to the model for the next round. Offline simulation and search happen inside the model's step.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/>
    </marker>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97757"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #aab3b8; stroke-width: 1.5; }
      .agent { fill: #fdf1ec; stroke: #d97757; stroke-width: 2; }
      .offline { fill: #ffffff; stroke: #d97757; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .label { font: 700 19px Arial, sans-serif; fill: #1f1f1f; text-anchor: middle; }
      .detail { font: 15px Arial, sans-serif; fill: #5f5e5a; text-anchor: middle; }
      .mono { font: 15px Menlo, Consolas, monospace; fill: #5f5e5a; text-anchor: middle; }
      .arrow { fill: none; stroke: #52514e; stroke-width: 2; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #d97757; stroke-width: 2.5; marker-end: url(#loop-arrow); }
      .looptext { font: 15px Arial, sans-serif; fill: #8a4a33; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1008" height="250" fill="#ffffff"/>

  <rect class="agent" x="24" y="24" width="280" height="104" rx="10"/>
  <text class="label" x="164" y="56">Language model</text>
  <text class="detail" x="164" y="82">writes the next round</text>
  <text class="mono" x="164" y="106">proposal.md  policy.py</text>

  <path class="arrow" d="M 316 76 H 352"/>

  <rect class="box" x="364" y="24" width="280" height="104" rx="10"/>
  <text class="label" x="504" y="56">Harness</text>
  <text class="detail" x="504" y="82">one official evaluation</text>
  <text class="detail" x="504" y="106">per round</text>

  <path class="arrow" d="M 656 76 H 692"/>

  <rect class="box" x="704" y="24" width="280" height="104" rx="10"/>
  <text class="label" x="844" y="56">Feedback</text>
  <text class="detail" x="844" y="82">score, step trace,</text>
  <text class="detail" x="844" y="106">failure summary, video</text>

  <path class="loop" d="M 844 136 V 214 Q 844 226 832 226 H 284 Q 272 226 272 214 V 134"/>
  <text class="looptext" x="558" y="244">next round</text>

  <rect class="offline" x="24" y="150" width="216" height="46" rx="8"/>
  <text class="detail" x="132" y="179">offline simulation and search</text>
  <path d="M 132 150 V 130" stroke="#d97757" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
