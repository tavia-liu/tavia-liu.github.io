<svg xmlns="http://www.w3.org/2000/svg" width="1008" height="180" viewBox="0 0 1008 180" role="img" aria-labelledby="title desc">
  <title id="title">The self-improvement loop</title>
  <desc id="desc">Write a policy, evaluate it, inspect the feedback, and revise the policy. A return arrow connects the revision to the next cycle.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/>
    </marker>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97757"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #aab3b8; stroke-width: 1.5; }
      .agent { fill: #fdf1ec; stroke: #d97757; stroke-width: 2; }
      .label { font: 700 20px Arial, sans-serif; fill: #1f1f1f; text-anchor: middle; dominant-baseline: middle; }
      .arrow { fill: none; stroke: #52514e; stroke-width: 2; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #d97757; stroke-width: 2.5; marker-end: url(#loop-arrow); }
    </style>
  </defs>
  <rect width="1008" height="180" fill="#ffffff"/>
  <rect class="agent" x="24" y="28" width="204" height="80" rx="10"/>
  <text class="label" x="126" y="68">Write policy</text>
  <path class="arrow" d="M 240 68 H 264"/>
  <rect class="box" x="276" y="28" width="204" height="80" rx="10"/>
  <text class="label" x="378" y="68">Evaluate</text>
  <path class="arrow" d="M 492 68 H 516"/>
  <rect class="box" x="528" y="28" width="204" height="80" rx="10"/>
  <text class="label" x="630" y="68">Inspect feedback</text>
  <path class="arrow" d="M 744 68 H 768"/>
  <rect class="agent" x="780" y="28" width="204" height="80" rx="10"/>
  <text class="label" x="882" y="68">Revise policy</text>
  <path class="loop" d="M 882 110 V 136 Q 882 148 870 148 H 138 Q 126 148 126 136 V 112"/>
  <text x="504" y="166" text-anchor="middle" style="font: 15px Arial, sans-serif; fill: #8a4a33;">next round</text>
</svg>
