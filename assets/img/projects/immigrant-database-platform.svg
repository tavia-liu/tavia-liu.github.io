    <rect x="102" y="510" width="996" height="43" fill="#ffffff"/>
    <text x="124" y="537">120138296 Line25 Image112</text><text x="348" y="537">Quan Hing</text><text x="544" y="537">China</text><text x="676" y="537">Hong Kong to San Francisco</text><text x="910" y="537">1910-06-25</text>
    <rect x="102" y="553" width="996" height="43" fill="#fafaf7"/>
