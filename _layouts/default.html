<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Main navigation">
        {% for item in site.data.navigation %}
          <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </header>

    <main id="content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div>
        <strong>{{ site.title }}</strong>
        <span>tavialiu.com</span>
      </div>
      <nav class="social-links" aria-label="Social links">
        <a href="{{ site.author.links.github }}">GitHub</a>
        <a href="{{ site.author.links.linkedin }}">LinkedIn</a>
        <a href="{{ site.author.links.x }}">X</a>
        <a href="{{ site.author.links.instagram }}">Instagram</a>
        <a href="{{ site.author.links.xiaohongshu }}">Xiaohongshu</a>
      </nav>
    </footer>
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
