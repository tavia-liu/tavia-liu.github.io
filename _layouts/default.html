<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css?v=20260728-career' | relative_url }}">
  </head>
  <body{% if page.url == "/" %} class="is-home"{% endif %}>
    <header class="site-header">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Main navigation">
        {% for item in site.data.navigation %}
          <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </header>

    <main id="content">
      {{ content }}
    </main>

    {% unless page.url == "/" %}
      <nav class="film-axis" aria-label="Page timeline" hidden>
        <span class="film-axis__index" data-film-index>01 / 01</span>
        <span class="film-axis__track">
          <span class="film-axis__progress" data-film-progress></span>
          <span class="film-axis__ticks" data-film-ticks></span>
        </span>
        <span class="film-axis__caption" data-film-caption>Frame</span>
      </nav>
    {% endunless %}

    <footer class="site-footer">
      <div>
        <strong>{{ site.title }}</strong>
      </div>
      <nav class="social-links" aria-label="Social links">
        {% include social-icons.html %}
      </nav>
    </footer>
    <script src="{{ '/assets/js/site.js?v=20260728-career' | relative_url }}" defer></script>
  </body>
</html>
