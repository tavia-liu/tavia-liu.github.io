<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    {% assign og_image = page.og_image | default: '/assets/img/tavia-liu-headshot-2026-campus.jpg' %}
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ og_image | absolute_url }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image" content="{{ og_image | absolute_url }}">
    <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="icon" href="{{ '/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css?v=1791816884' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/sidebar.css?v=1791816884' | relative_url }}">
  </head>
  <body{% if page.url == "/" %} class="is-home"{% endif %}>
    {% include sidebar.html %}

    <main id="content">
      {{ content }}
    </main>

    {% unless page.url == "/" %}
      <nav class="film-axis" aria-label="Page timeline" hidden>
        <span class="film-axis__index" data-film-index>01 / 01</span>
        <span class="film-axis__track">
          <span class="film-axis__progress" data-film-progress></span>
          <span class="film-axis__ticks" data-film-ticks></span>
        </span>
        <span class="film-axis__caption" data-film-caption>Frame</span>
      </nav>
    {% endunless %}

    <footer class="site-footer">&copy; {{ site.time | date: "%Y" }} Buzhao (Tavia) Liu</footer>
    <script src="{{ '/assets/js/site.js?v=20261003-nav' | relative_url }}" defer></script>
  </body>
</html>
