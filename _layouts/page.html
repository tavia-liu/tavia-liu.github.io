---
layout: default
---
<article class="page-shell">
  <header class="page-header">
    <p class="eyebrow">{{ page.eyebrow | default: "Notebook" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p class="lede">{{ page.description }}</p>
    {% endif %}
  </header>
  {{ content }}
</article>
